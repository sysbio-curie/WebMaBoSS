name: Release

on:
  release:
    types: [created]

jobs:

  publish_docker:
    name: Testing and publishing WebMaBoSS docker image
    runs-on: ubuntu-24.04
    if: github.repository == 'sysbio-curie/WebMaBoSS'
    timeout-minutes: 120

    env:
      TAG: ${{ github.event.release.tag_name }}

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    # The image is ~4.5GB, and the runner only has ~14GB of free disk
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af

    - uses: docker/setup-buildx-action@v4

    - name: Build the image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        tags: webmaboss:${{ env.TAG }}
        load: true
        cache-from: type=gha

    # Nothing is published if the tests fail
    - name: Run the tests
      run: tests/run_ci.sh webmaboss:$TAG
      env:
        OUT: tests-output

    - name: Upload snapshots, screenshots and logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tests-output
        path: tests-output

    - name: Connect to Docker Hub
      run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

    - name: Connect to the GitHub container registry
      run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io --username ${{ github.actor }} --password-stdin

    - name: Publish
      run: |
        for image in sysbiocurie/webmaboss vnoel/webmaboss ghcr.io/${{ github.repository_owner }}/webmaboss; do
          image=$(echo $image | tr '[:upper:]' '[:lower:]')
          for tag in $TAG latest; do
            docker tag webmaboss:$TAG $image:$tag
            docker push $image:$tag
          done
        done
