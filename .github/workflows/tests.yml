name: Tests

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests and smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    # The image is ~4.5GB, and the runner only has ~14GB of free disk
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
        df -h /

    - uses: docker/setup-buildx-action@v4

    - name: Build the image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        tags: webmaboss:ci
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Unit tests, API and browser smoke tests, compared with tests/smoke/reference
    - name: Run the tests
      run: tests/run_ci.sh webmaboss:ci
      env:
        OUT: tests-output

    - name: Upload snapshots, screenshots and logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tests-output
        path: tests-output
        retention-days: 14
